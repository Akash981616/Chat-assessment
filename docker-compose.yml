services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-chat-password-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_app -d chat_app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  firestore:
    build:
      context: .
      dockerfile: Dockerfile
      target: firestore-emulator
    volumes:
      - firestore-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    environment: &app-environment
      PORT: 3000
      DATABASE_URL: postgres://chat_app:${POSTGRES_PASSWORD:-local-chat-password-change-me}@postgres:5432/chat_app
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy-1234567890}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FIREBASE_PROJECT_ID: chat-backend-local
      FIRESTORE_EMULATOR_HOST: firestore:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    command: ["node", "dist/worker.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      firestore:
        condition: service_healthy

  checks:
    profiles: ["checks"]
    build:
      context: .
      dockerfile: Dockerfile
      target: checks
    command: ["npm", "test"]
    environment:
      <<: *app-environment
      API_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  firestore-data:
